name: Fix reviewer cache permissions

# Remediation automation for consumer repos calling the PR-review reusable
# workflow (docker/docker-agent-action/.github/workflows/review-pr.yml) with
# `actions: read` on the calling job.
#
# The reusable workflow saves caches on behalf of the caller (review lock,
# review memory, binary cache), and cache writes require `actions: write`;
# with `actions: read` they fail with a 403. `write` implicitly includes
# `read`, so artifact/cache downloads keep working after the upgrade.
#
# The workflow searches org:docker for workflow files referencing the
# reusable workflow, clones each consumer, flips `actions: read` to
# `actions: write` in the permissions block of the calling job(s) only, and
# opens one PR per repo via signed commits. Consumers whose calling jobs all
# already have `actions: write` are reported as already compliant. Calling
# jobs the safe flip cannot make compliant (no permissions block, read-all,
# no actions entry, actions: none, unsupported YAML shapes) put the whole
# repo under "Needs manual review": no commit, PR, or any other GitHub write
# is made for it — even when another job in the repo was fixable — so a
# partial PR can never masquerade as a complete fix.
#
# Routing mirrors migrate-consumers.yml: direct PR when the machine user has
# write access, fork PR when it does not but forking is allowed, otherwise
# the repo is reported under Skipped for a manual update. Re-runs are
# idempotent: a stable branch is force-rebuilt from the default branch and an
# existing open PR is updated instead of duplicated. Dry-run (default ON)
# shows the diff and the direct/fork/skip route without any writes.
#
# All rewrite logic lives in src/fix-reviewer-cache-permission (TypeScript,
# unit tested) — this workflow only orchestrates discovery, cloning, and PRs.

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated allowlist of repos to process (e.g. docker/sailor,docker/compose). Empty = all discovered consumers."
        required: false
        type: string
        default: ""
      dry-run:
        description: "Dry run: show the diffs that would be committed, but do not push commits or open PRs."
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: fix-reviewer-cache-permissions
  cancel-in-progress: false

jobs:
  fix-reviewer-cache-permissions:
    name: Fix consumer cache permissions
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      # dist/ is gitignored on non-release refs, so the CLI tools (and the
      # credentials bundle used by setup-credentials below) must be built
      # from source before the composite action can run.
      - name: Build CLI tools
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Setup credentials
        uses: ./setup-credentials

      # setup-credentials already masks the token via core.setSecret, but the
      # invariant lives in another module — re-mask explicitly here so this
      # workflow stays safe even if that implementation detail changes.
      - name: Mask app token
        run: echo "::add-mask::$GITHUB_APP_TOKEN"

      - name: Discover consumer repos
        id: discover
        env:
          GH_TOKEN: ${{ env.GITHUB_APP_TOKEN }}
          REPO_ALLOWLIST: ${{ inputs.repos }}
        run: |
          set -euo pipefail

          # Search for references to the reviewer reusable workflow (any ref).
          # GitHub code search treats the quoted string as a literal substring.
          echo "Searching org:docker for review-pr.yml consumers..."
          REPOS=$(gh api --method GET --paginate '/search/code?per_page=100' \
            -f q='org:docker "docker/docker-agent-action/.github/workflows/review-pr.yml@" language:YAML path:.github/workflows' \
            --jq '[.items[].repository.full_name] | unique | .[]')

          if [ -z "$REPOS" ]; then
            echo "No consumer repos found."
            echo "repos=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Never process the action repos themselves: this repo references
          # its own reusable workflow via local paths and contains this
          # workflow's own search string, and the legacy repo's automation
          # embeds the same string in a script block — neither is a consumer.
          REPOS=$(printf '%s\n' "$REPOS" | grep -vxF \
            -e 'docker/docker-agent-action' \
            -e 'docker/cagent-action' || true)

          if [ -z "$REPOS" ]; then
            echo "No consumer repos found after exclusions."
            echo "repos=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Apply the allowlist filter if provided (pilot runs).
          if [ -n "$REPO_ALLOWLIST" ]; then
            FILTERED=""
            IFS=',' read -ra ALLOWED <<< "$REPO_ALLOWLIST"
            while IFS= read -r REPO; do
              for A in "${ALLOWED[@]}"; do
                # Trim surrounding whitespace via parameter expansion — unlike
                # xargs this does not interpret backslashes or quotes, so a
                # malformed entry cannot corrupt the filtering.
                A_TRIMMED="${A#"${A%%[![:space:]]*}"}"
                A_TRIMMED="${A_TRIMMED%"${A_TRIMMED##*[![:space:]]}"}"
                if [ "$REPO" = "$A_TRIMMED" ]; then
                  FILTERED+="$REPO"$'\n'
                fi
              done
            done <<< "$REPOS"
            REPOS=$(printf '%s' "$FILTERED")
            if [ -z "$REPOS" ]; then
              echo "::warning::Allowlist did not match any discovered consumer repos"
              echo "repos=" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "Consumer repos to process:"
          echo "$REPOS"
          {
            echo 'repos<<REPOS_EOF'
            echo "$REPOS"
            echo 'REPOS_EOF'
          } >> $GITHUB_OUTPUT

      - name: Fix permissions and open PRs
        if: steps.discover.outputs.repos != ''
        env:
          GH_TOKEN: ${{ env.GITHUB_APP_TOKEN }}
          REPOS: ${{ steps.discover.outputs.repos }}
          DRY_RUN: ${{ inputs.dry-run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          BRANCH="fix/reviewer-cache-permissions"
          PR_TITLE="fix: allow reviewer cache writes"
          FIX_CLI="$GITHUB_WORKSPACE/dist/fix-reviewer-cache-permission.js"
          SUMMARY_CHANGED=""
          SUMMARY_MANUAL=""
          SUMMARY_SKIPPED=""

          # Single EXIT trap registered once, referencing a global — avoids
          # re-registering a trap per loop iteration (traps don't stack; a
          # single-quoted per-iteration trap would silently replace the
          # previous handler). cleanup_workdir is also called explicitly on
          # every skip/continue path and is a no-op when already cleaned.
          CURRENT_WORK_DIR=""
          cleanup_workdir() {
            cd /
            if [ -n "$CURRENT_WORK_DIR" ]; then
              rm -rf "$CURRENT_WORK_DIR"
              CURRENT_WORK_DIR=""
            fi
          }
          trap cleanup_workdir EXIT

          while IFS= read -r REPO; do
            [ -z "$REPO" ] && continue
            echo "=========================================="
            echo "Processing ${REPO}..."
            echo "=========================================="

            WORK_DIR=$(mktemp -d)
            CURRENT_WORK_DIR="$WORK_DIR"
            if ! gh repo clone "$REPO" "$WORK_DIR" -- --depth=1 2>/dev/null; then
              echo "::warning::Failed to clone $REPO — skipping (token may lack access)"
              SUMMARY_SKIPPED+="- ${REPO} (clone failed)"$'\n'
              cleanup_workdir
              continue
            fi

            cd "$WORK_DIR"

            # Find every workflow file referencing the reusable workflow.
            # grep is only a cheap pre-filter — the tested CLI decides which
            # files actually have a calling job with `actions: read`. grep -l
            # exits 1 when nothing matches, so guard with || true.
            MATCHING_FILES=$(grep -rlE --include='*.yml' --include='*.yaml' \
              'docker/docker-agent-action/\.github/workflows/review-pr\.yml@' \
              .github/workflows/ 2>/dev/null || true)
            if [ -z "$MATCHING_FILES" ]; then
              echo "No reusable-workflow references found in $REPO — skipping"
              SUMMARY_SKIPPED+="- ${REPO} (no local references)"$'\n'
              cleanup_workdir
              continue
            fi

            # Rewrite the matching files via the tested TS tool. Build the
            # argument list as a bash array (no eval, see AGENTS.md). The CLI
            # prints one "<status> <path>" line per file — changed,
            # needs-manual, compliant, skipped; a mixed file appears under
            # both changed and needs-manual — and exits 1 on any per-file
            # error, so a partial CHANGED_FILES list is never committed.
            FILE_ARGS=()
            while IFS= read -r F; do
              FILE_ARGS+=("$F")
            done <<< "$MATCHING_FILES"

            FIX_OUTPUT=$(node "$FIX_CLI" "${FILE_ARGS[@]}") || {
              echo "::warning::fix-reviewer-cache-permission failed for $REPO — skipping"
              SUMMARY_SKIPPED+="- ${REPO} (rewrite failed)"$'\n'
              cleanup_workdir
              continue
            }
            CHANGED_FILES=$(printf '%s\n' "$FIX_OUTPUT" | sed -n 's/^changed //p')
            MANUAL_FILES=$(printf '%s\n' "$FIX_OUTPUT" | sed -n 's/^needs-manual //p')
            COMPLIANT_FILES=$(printf '%s\n' "$FIX_OUTPUT" | sed -n 's/^compliant //p')

            # A calling job the safe flip cannot make compliant keeps failing
            # with 403 even after the flip, so committing the fixable rest
            # would open a PR that looks complete while it is not. Route the
            # whole repo to a human instead, with no GitHub writes (no fork,
            # no commit, no PR) — in dry-run and real mode alike.
            if [ -n "$MANUAL_FILES" ]; then
              echo "Files with calling jobs the safe flip cannot make compliant in $REPO:"
              echo "$MANUAL_FILES"
              echo "Not committing or opening a PR — a partial fix would hide the remaining 403s."
              MANUAL_LIST=""
              while IFS= read -r F; do
                [ -z "$F" ] && continue
                MANUAL_LIST+="${MANUAL_LIST:+, }${F}"
              done <<< "$MANUAL_FILES"
              SUMMARY_MANUAL+="- ${REPO}: ${MANUAL_LIST}"$'\n'
              cleanup_workdir
              continue
            fi

            if [ -z "$CHANGED_FILES" ] || git diff --quiet; then
              if [ -n "$COMPLIANT_FILES" ]; then
                echo "No changes needed — every reviewer-calling job already has actions: write"
                SUMMARY_SKIPPED+="- ${REPO} (already compliant — actions: write already set)"$'\n'
              else
                echo "No reviewer-calling jobs in the matching files — nothing to fix"
                SUMMARY_SKIPPED+="- ${REPO} (no reviewer-calling jobs)"$'\n'
              fi
              cleanup_workdir
              continue
            fi

            echo "Changed files:"
            echo "$CHANGED_FILES"

            # Resolve how this repo would be fixed (read-only) so a dry run
            # reports the routing without performing any writes:
            #   direct: the machine user has write, so commit the branch into the
            #     repo and open a same-repo PR.
            #   fork:   no write access. Fork under the machine user, commit on
            #     the fork, and open a cross-repo PR (head "owner:branch"). Needs
            #     only read on the upstream, like an external contribution.
            #   skip:   no write access AND forking disabled. Cannot be fixed
            #     automatically; reported under Skipped for a manual update.
            # Fetch the repo metadata in one call (race-free vs separate calls)
            # and coerce missing fields with jq's `// false`: `gh ... --jq` prints
            # the string "null" for an absent field, which is neither "true" nor
            # "false" and would misroute a repo. default_branch comes from the
            # same response; an empty value (or a failed call -> "{}") skips the
            # repo rather than aborting the whole run under set -euo pipefail.
            REPO_META=$(gh api "repos/$REPO" 2>/dev/null || echo '{}')
            DEFAULT_BRANCH=$(printf '%s' "$REPO_META" | jq -r '.default_branch // empty')
            if [ -z "$DEFAULT_BRANCH" ]; then
              echo "::warning::Failed to resolve default branch for $REPO — skipping"
              SUMMARY_SKIPPED+="- ${REPO} (default-branch lookup failed)"$'\n'
              cleanup_workdir
              continue
            fi
            CAN_PUSH=$(printf '%s' "$REPO_META" | jq -r '.permissions.push // false')
            ALLOW_FORKING=$(printf '%s' "$REPO_META" | jq -r '.allow_forking // false')
            if [ "$CAN_PUSH" = "true" ]; then
              ROUTE="direct"
            elif [ "$ALLOW_FORKING" = "true" ]; then
              ROUTE="fork"
            else
              ROUTE="skip"
            fi

            if [ "$DRY_RUN" = "true" ]; then
              N_FILES=$(echo "$CHANGED_FILES" | wc -l | tr -d ' ')
              echo "DRY RUN — route: ${ROUTE}; diff that would be committed:"
              git --no-pager diff
              if [ "$ROUTE" = "skip" ]; then
                SUMMARY_SKIPPED+="- ${REPO} (dry run — no write access, forking disabled)"$'\n'
              else
                SUMMARY_CHANGED+="- ${REPO} (dry run — ${ROUTE} PR, ${N_FILES} file(s))"$'\n'
              fi
              cleanup_workdir
              continue
            fi

            # Resolve the repo + head ref to commit to, per the route above.
            if [ "$ROUTE" = "skip" ]; then
              echo "::warning::No write access and forking disabled on $REPO — skipping (needs a write grant or manual update)"
              SUMMARY_SKIPPED+="- ${REPO} (no write access, forking disabled)"$'\n'
              cleanup_workdir
              continue
            elif [ "$ROUTE" = "direct" ]; then
              COMMIT_REPO="$REPO"
              PR_HEAD="$BRANCH"
            else
              FORK_OWNER=$(gh api user --jq .login) || {
                echo "::warning::Could not resolve the machine-user login for $REPO — skipping"
                SUMMARY_SKIPPED+="- ${REPO} (could not resolve fork owner)"$'\n'
                cleanup_workdir
                continue
              }
              if [ -z "$FORK_OWNER" ]; then
                echo "::warning::Machine-user login resolved to empty for $REPO — skipping"
                SUMMARY_SKIPPED+="- ${REPO} (empty fork owner)"$'\n'
                cleanup_workdir
                continue
              fi
              FORK="${FORK_OWNER}/$(basename "$REPO")"
              echo "No write access on $REPO — opening a fork PR from ${FORK}"
              # Fork is idempotent (no-op when it already exists) and created
              # asynchronously, so poll until the API can see it. The exit code is
              # ignored on purpose (some gh versions return non-zero when the fork
              # already exists), but stderr is kept so a genuine fork failure is
              # distinguishable from slow async readiness in the skip warning.
              FORK_ERR=$(gh repo fork "$REPO" --clone=false --default-branch-only 2>&1 >/dev/null || true)
              FORK_READY=""
              for _ in $(seq 1 10); do
                if gh api "repos/$FORK" >/dev/null 2>&1; then FORK_READY=1; break; fi
                sleep 3
              done
              if [ -z "$FORK_READY" ]; then
                echo "::warning::Fork ${FORK} did not become available — skipping $REPO${FORK_ERR:+ (fork error: $FORK_ERR)}"
                SUMMARY_SKIPPED+="- ${REPO} (fork not ready)"$'\n'
                cleanup_workdir
                continue
              fi
              # Guard against a name collision: proceed only if $FORK is really a
              # fork of $REPO. gh can rename a fork, and the machine user may own
              # an unrelated repo of the same basename — committing to the wrong
              # repo must never happen.
              FORK_PARENT=$(gh api "repos/$FORK" --jq '.parent.full_name // empty' 2>/dev/null || true)
              if [ "$FORK_PARENT" != "$REPO" ]; then
                echo "::warning::${FORK} is not a fork of ${REPO} (parent='${FORK_PARENT:-none}') — skipping to avoid writing to the wrong repo"
                SUMMARY_SKIPPED+="- ${REPO} (fork name collision)"$'\n'
                cleanup_workdir
                continue
              fi
              # Force-sync the fork's default branch to upstream so the cross-repo
              # PR diff shows only the fix, not drift from a stale fork.
              gh repo sync "$FORK" --branch "$DEFAULT_BRANCH" --force >/dev/null 2>&1 || true
              COMMIT_REPO="$FORK"
              PR_HEAD="${FORK_OWNER}:${BRANCH}"
            fi

            # Create one signed commit covering all changed files, on whichever
            # repo was resolved above (the upstream when we have write, else the
            # fork). --force rebuilds the stable branch from the default branch
            # tip, keeping re-runs idempotent.
            ADD_ARGS=()
            while IFS= read -r F; do
              ADD_ARGS+=(--add "$F")
            done <<< "$CHANGED_FILES"

            COMMIT_OID=$(GITHUB_TOKEN="${GH_TOKEN}" node "$GITHUB_WORKSPACE/dist/signed-commit.js" \
              --repo "$COMMIT_REPO" \
              --branch "$BRANCH" \
              --base-ref "$DEFAULT_BRANCH" \
              --force \
              --message "$PR_TITLE" \
              "${ADD_ARGS[@]}") || {
              echo "::warning::Failed to create signed commit in $COMMIT_REPO (may lack write access)"
              SUMMARY_SKIPPED+="- ${REPO} (commit failed)"$'\n'
              cleanup_workdir
              continue
            }

            echo "Signed commit: $COMMIT_OID"

            # Look up an existing open PR for idempotent re-runs. `gh pr list
            # --head` matches a branch NAME only and does NOT support the
            # "owner:branch" form, so a fork PR is looked up via the REST pulls
            # endpoint, whose head=owner:branch filter does. `// empty` keeps an
            # absent PR from becoming the literal string "null".
            if [ "$ROUTE" = "fork" ]; then
              EXISTING_PR=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="${FORK_OWNER}:${BRANCH}" --jq '.[0].number // empty' 2>/dev/null || true)
            else
              EXISTING_PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
            fi

            printf -v PR_BODY '%s\n\n%s\n%s\n%s\n\n%s\n\n%s' \
              "## Summary" \
              "The \`docker/docker-agent-action\` PR-review reusable workflow saves caches on behalf of the calling job (review lock, review memory, binary cache), and cache writes require \`actions: write\` on the caller — with \`actions: read\` they fail with a 403." \
              "This PR upgrades \`actions: read\` to \`actions: write\` in the job(s) calling the reusable workflow." \
              "\`actions: write\` implicitly includes \`read\`, so artifact and cache downloads keep working." \
              "No other permission is changed." \
              "> Auto-generated by the [fix-reviewer-cache-permissions](${RUN_URL}) workflow."

            if [ -n "$EXISTING_PR" ]; then
              echo "Updating existing PR #$EXISTING_PR in $REPO"
              gh pr edit "$EXISTING_PR" --repo "$REPO" \
                --title "$PR_TITLE" \
                --body "$PR_BODY" 2>&1 || echo "::warning::Failed to update PR #$EXISTING_PR in $REPO (may be non-fatal)"
              PR_URL=$(gh pr view "$EXISTING_PR" --repo "$REPO" --json url --jq .url 2>/dev/null || echo "")
            else
              echo "Creating new PR in $REPO"
              PR_URL=$(gh pr create --repo "$REPO" \
                --head "$PR_HEAD" \
                --base "$DEFAULT_BRANCH" \
                --title "$PR_TITLE" \
                --body "$PR_BODY") || {
                echo "::warning::Failed to create PR in $REPO"
                PR_URL=""
              }
            fi

            # Reviewer assignment is best-effort and decoupled from PR
            # creation: `gh pr create --reviewer` fails the ENTIRE create when
            # the reviewer is not a collaborator of the consumer repo, which
            # would silently drop the fix PR.
            if [ -n "$PR_URL" ]; then
              gh pr edit "$PR_URL" --add-reviewer "derekmisler" 2>&1 \
                || echo "::warning::Could not add reviewer on $PR_URL (non-fatal)"
            fi

            SUMMARY_CHANGED+="- ${REPO} ${PR_URL:+(${PR_URL})}"$'\n'

            cleanup_workdir
            echo ""
          done <<< "$REPOS"

          # Job summary for triage.
          {
            echo "## Fix reviewer cache permissions — $([ "$DRY_RUN" = "true" ] && echo 'DRY RUN' || echo 'EXECUTED')"
            echo ""
            if [ -n "$SUMMARY_CHANGED" ]; then
              echo "### PRs opened / repos with changes"
              printf '%s' "$SUMMARY_CHANGED"
              echo ""
            fi
            if [ -n "$SUMMARY_MANUAL" ]; then
              echo "### Needs manual review"
              echo ""
              echo "Calling jobs in the listed files cannot be made compliant by the safe flip (no permissions block, read-all, no actions entry, actions: none, or unsupported YAML). No commit or PR was made for these repos — they still need a manual permissions fix."
              echo ""
              printf '%s' "$SUMMARY_MANUAL"
              echo ""
            fi
            if [ -n "$SUMMARY_SKIPPED" ]; then
              echo "### Skipped"
              printf '%s' "$SUMMARY_SKIPPED"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Done."
